spring.application.name=catalogo-videojuegos

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/videojuegos_db
spring.datasource.username=root
spring.datasource.password=contrasena

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false