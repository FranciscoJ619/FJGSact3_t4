
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0" th:text="${videojuego.id == null ? 'Registrar videojuego' : 'Editar videojuego'}">
                    Formulario de videojuego
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Nombre del videojuego</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Minecraft" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Desarrollador</label>
                        <input type="text" th:field="*{desarrollador}" class="form-control" placeholder="Ej. Mojang Studios" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Género</label>
                        <select th:field="*{genero.id}" class="form-select" required>
                            <option value="">Selecciona un género</option>
                            <option th:each="genero : ${generos}" th:value="${genero.id}" th:text="${genero.nombre}"></option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/videojuegos}" class="btn btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            Guardar videojuego
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
