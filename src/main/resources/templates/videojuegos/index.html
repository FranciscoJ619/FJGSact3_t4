
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Catálogo de Videojuegos</h1>
            <a th:href="@{/videojuegos/nuevo}" class="btn btn-primary">
                Registrar videojuego
            </a>
        </div>
        <div th:if="${mensaje}" class="alert alert-success" role="alert">
            <span th:text="${mensaje}"></span>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Desarrollador</th>
                                <th>Género</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="videojuego : ${videojuegos}">
                                <td th:text="${videojuego.id}"></td>
                                <td th:text="${videojuego.nombre}"></td>
                                <td th:text="${videojuego.desarrollador}"></td>
                                <td th:text="${videojuego.genero.nombre}"></td>
                                <td>
                                    <a th:href="@{/videojuegos/editar/{id}(id=${videojuego.id})}" class="btn btn-warning btn-sm">
                                        Editar
                                    </a>
                                    <form th:action="@{/videojuegos/eliminar/{id}(id=${videojuego.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Deseas eliminar este videojuego?')">
                                            Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(videojuegos)}">
                                <td colspan="5" class="text-center text-muted">
                                    Todavía no hay videojuegos registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
